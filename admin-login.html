<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal - Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        headline: ['Unbounded', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1E2A38',
                        secondary: '#4F9DA6',
                        background: '#FAF9F6',
                        'border-light': '#EAE8E4',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background font-body min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white border border-border-light p-10 rounded-[32px] shadow-lg flex flex-col gap-8">
        <!-- Logo / Brand -->
        <div class="text-center flex flex-col items-center">
            <img src="logo.png" alt="Ishita's Dental Logo" class="h-16 w-16 object-contain mb-4">
            <h1 class="font-headline text-xl font-bold text-primary">Doctor Portal</h1>
            <p class="text-on-surface-variant text-sm mt-1">Sign in to manage appointments</p>
        </div>

        <!-- Alert Container -->
        <div id="error-alert" class="bg-red-50 text-red-700 p-4 rounded-xl text-sm font-semibold border-l-4 border-red-500 hidden leading-relaxed"></div>

        <!-- Form -->
        <form id="login-form" class="space-y-6">
            <div class="space-y-2">
                <label class="block text-sm font-bold text-primary px-1">Email Address</label>
                <input class="w-full bg-background border border-border-light rounded-2xl p-4 text-sm focus:ring-2 focus:ring-secondary/50 outline-none" type="email" id="email" placeholder="doctor@ishitadental.com" required>
            </div>
            
            <div class="space-y-2">
                <label class="block text-sm font-bold text-primary px-1">Password</label>
                <input class="w-full bg-background border border-border-light rounded-2xl p-4 text-sm focus:ring-2 focus:ring-secondary/50 outline-none" type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full bg-primary text-white py-5 rounded-[32px] font-bold text-base hover:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">login</span> Sign In
            </button>
        </form>

        <!-- Footer Note -->
        <div class="text-center text-xs text-slate-400">
            <a href="index.html" class="hover:text-secondary transition-colors inline-flex items-center gap-1">
                <span class="material-symbols-outlined text-xs">arrow_back</span> Return to Homepage
            </a>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://zisyxbmrxzlkwsgfqzex.supabase.co';
        const supabaseKey = 'sb_publishable_yslfiwQ1nQgpq1AqG5Bkog_YLZha0KF';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-alert');

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'admin-dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = form.querySelector('button[type="submit"]');

            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            alertBox.classList.add('hidden');

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                // Redirect to dashboard
                window.location.href = 'admin-dashboard.html';
            } catch (err) {
                console.error(err);
                alertBox.textContent = err.message || 'Authentication failed. Please verify credentials.';
                alertBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<span class="material-symbols-outlined text-sm">login</span> Sign In`;
            }
        });
    </script>
</body>
</html>
